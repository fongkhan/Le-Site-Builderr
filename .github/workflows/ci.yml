name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  orchestrator:
    name: Orchestrateur — lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # CSP posée au build (plugin orchestratorCsp) et polices auto-hébergées : aucune
      # requête vers Google depuis l'orchestrateur compilé
      - name: CSP et aucune police Google dans dist
        run: |
          if ! grep -q 'http-equiv="Content-Security-Policy"' dist/index.html; then
            echo "::error::dist/index.html sans <meta http-equiv=\"Content-Security-Policy\">."
            exit 1
          fi
          if grep -rqE 'fonts\.(googleapis|gstatic)\.com' dist; then
            echo "::error::dist référence encore Google Fonts (fonts.googleapis.com / fonts.gstatic.com)."
            exit 1
          fi
          echo "OK : CSP posée, aucune police Google."
      # Code de l'interface seulement : les tests citent des charges hostiles (« javascript:alert(1) »)
      - name: Aucun alert()/confirm()/prompt() natif
        run: |
          if grep -rnE "\b(alert|confirm|prompt)\(" src --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx' | grep -v '^\s*//' | grep -vE '(//|\*).*\b(alert|confirm|prompt)\('; then
            echo "::error::Des appels natifs alert()/confirm()/prompt() subsistent — utiliser les toasts/modales."
            exit 1
          fi
          echo "OK : aucun appel natif."

  server-unit:
    name: Serveur — tests unitaires (sans DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Tests de logique pure (slug, confinement de chemins, quota) — rapides, sans Postgres
      - run: npm test

  client-template:
    name: Template Astro — build & site de démonstration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-template/package-lock.json
      # Sans serveur, le build utilise la page de fallback hors-ligne : il doit passer quand même
      - run: npm ci
      - run: npm run build
      # Fixture : les 11 blocs, 2 langues, le blog et des saisies hostiles, servis sous un
      # sous-chemin (aperçu) puis à la racine (production) — sortie vérifiée automatiquement
      - name: Build fixture sous /preview/demo
        run: |
          TEMPLATE_FIXTURE=$PWD/fixtures/site.json SITE_BASE_PATH=/preview/demo PUBLIC_SITE_URL=https://demo.example PUBLIC_SITE_NAME=Demo PUBLIC_SITE_LOGO=/media/logo-demo.png npm run build
          node scripts/check-fixture-build.mjs /preview/demo --logo=/media/logo-demo.png
      # À la racine : API sur une autre origine, statistiques de visite et Matomo (bannière de
      # consentement) — mêmes variables pour le build et la vérification (CSP attendue)
      - name: Build fixture à la racine
        run: |
          export PUBLIC_API_BASE=https://api.demo.example ACTIVE_SITE_SLUG=demo PUBLIC_ANALYTICS_PROVIDER=matomo PUBLIC_ANALYTICS_ID=1 PUBLIC_ANALYTICS_HOST=stats.demo.example
          TEMPLATE_FIXTURE=$PWD/fixtures/site.json SITE_BASE_PATH=/ PUBLIC_SITE_URL=https://demo.example PUBLIC_SITE_NAME=Demo npm run build
          node scripts/check-fixture-build.mjs /

  security:
    name: Serveur — matrice de sécurité (rôles & ownership)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: metabuilder_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URI: postgres://postgres:postgrespassword@127.0.0.1:5432/metabuilder_db
      PAYLOAD_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: 4000
      # Quota à 0 : permet de vérifier le 429 côté client sans aucune clé IA
      AI_DAILY_QUOTA: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Base temporaire vide (créée puis supprimée) : premier compte, création anonyme,
      # GraphQL, login unifié sur les chemins non canoniques, journal des échecs
      - name: Contrôles d'authentification sur base vide
        run: npx tsx tests/auth-empty-db-check.mjs
      - name: Démarrer le serveur
        run: |
          # CLI de tsx lancée directement : SIGTERM lui parvient et il le relaie au serveur
          node node_modules/tsx/dist/cli.mjs index.js > server.log 2>&1 &
          echo $! > server.pid
          # Attendre que le serveur soit prêt (init Payload + push du schéma + seeding) :
          # /api/health/ready renvoie 200 seulement quand la base répond (-f : 503 = échec)
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4000/api/health/ready 2>/dev/null; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur n'a pas démarré à temps."
          cat server.log
          exit 1
      - name: Vérifier la matrice de sécurité
        run: node tests/security-check.mjs
      - name: Arrêt propre (SIGTERM)
        run: |
          PID="$(cat server.pid)"
          kill -TERM "$PID"
          # Le serveur doit s'arrêter seul (requêtes terminées) en moins de 20 s
          for i in $(seq 1 40); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "::error::Le serveur tourne encore 20 s après SIGTERM."
            exit 1
          fi
          grep -q "Arrêt propre terminé" server.log || { echo "::error::Arrêt propre non journalisé."; exit 1; }
          if curl -fsS -o /dev/null http://localhost:4000/api/health 2>/dev/null; then
            echo "::error::Le port 4000 répond encore après l'arrêt."
            exit 1
          fi
          echo "Arrêt propre OK."
      - name: Logs serveur (en cas d'échec)
        if: failure()
        run: cat server.log
      - name: Arrêter le serveur
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

  production:
    name: Serveur — production (build, migrations, interface, matrice)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: metabuilder_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # NODE_ENV n'est PAS défini ici : « npm ci » omettrait les devDependencies (typescript,
    # requis par « next build »). Le mode production vient de « npm run start:prod ».
    env:
      DATABASE_URI: postgres://postgres:postgrespassword@127.0.0.1:5432/metabuilder_prod
      PAYLOAD_SECRET: ci-prod-secret-0123456789abcdef0123456789abcdef
      FRONTEND_ORIGIN: http://localhost:5173
      PORT: 4000
      AI_DAILY_QUOTA: '0'
      SEED_ADMIN_EMAIL: admin@admin.com
      SEED_ADMIN_PASSWORD: Ci-Prod-Admin-2026!
      SEED_DEMO_CLIENT: 'true'
      SEED_CLIENT_PASSWORD: Ci-Prod-Client-2026!
      # Recette en HTTP simple : cookie de session sans l'attribut Secure
      COOKIE_SECURE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            orchestrator/package-lock.json
            server/package-lock.json
      - name: Construire l'orchestrateur (servi par le serveur)
        working-directory: orchestrator
        run: |
          npm ci
          npm run build
      - name: Installer le serveur
        working-directory: server
        run: npm ci
      # Toute modification de collection exige sa migration (sans base ni réseau)
      - name: Migrations à jour
        working-directory: server
        run: npm run migrate:check
      - name: Build Next de production
        working-directory: server
        run: npm run build
      - name: Démarrer en production (migrations appliquées au démarrage)
        working-directory: server
        run: |
          npm run start:prod > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4000/api/health/ready 2>/dev/null; then
              echo "Serveur prêt."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur de production n'a pas démarré à temps."
          cat server.log
          exit 1
      # Base neuve : schéma créé par les migrations versionnées, jamais poussé (batch -1)
      - name: Migrations enregistrées dans la base
        env:
          PGPASSWORD: postgrespassword
        run: |
          applied="$(psql -h 127.0.0.1 -U postgres -d metabuilder_prod -tAc 'SELECT count(*) FROM payload_migrations WHERE batch > 0')"
          pushed="$(psql -h 127.0.0.1 -U postgres -d metabuilder_prod -tAc 'SELECT count(*) FROM payload_migrations WHERE batch = -1')"
          echo "Migrations appliquées : $applied ; schéma poussé (dev) : $pushed"
          if [ "$applied" -lt 1 ] || [ "$pushed" -ne 0 ]; then
            echo "::error::Migrations non appliquées, ou schéma poussé comme en développement."
            exit 1
          fi
      - name: Vérifier la matrice de sécurité (production, interface servie)
        working-directory: server
        run: EXPECT_ORCHESTRATOR=true node tests/security-check.mjs
      # Redémarrage : aucune migration rejouée. SIGTERM adressé au serveur lui-même (npm ne
      # relaie pas le signal) ; « [i] » : le motif ne désigne jamais le shell de l'étape.
      - name: Redémarrer sans rejouer les migrations
        working-directory: server
        run: |
          pkill -TERM -f '[i]ndex\.js --production' || true
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null http://localhost:4000/api/health 2>/dev/null || break
            sleep 0.5
          done
          npm run start:prod >> server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4000/api/health/ready 2>/dev/null; then
              count="$(grep -c 'Migrating:' server.log)"
              echo "Migrations exécutées depuis le premier démarrage : $count"
              if [ "$count" -ne 1 ]; then
                echo "::error::Migration rejouée au redémarrage ($count exécutions)."
                exit 1
              fi
              exit 0
            fi
            sleep 2
          done
          echo "::error::Le serveur de production n'a pas redémarré à temps."
          exit 1
      - name: Logs serveur (en cas d'échec)
        if: failure()
        working-directory: server
        run: cat server.log
      - name: Arrêter le serveur
        if: always()
        run: pkill -TERM -f '[i]ndex\.js --production' || true

  docker:
    name: Image Docker de production (build et démarrage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: metabuilder_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # « docker compose up -d » ne lance que la base ; le profil prod ajoute le serveur
      - name: docker-compose.yml valide (profil prod)
        run: |
          docker compose --profile prod config -q
          test "$(docker compose config --services)" = "db"
      - name: Construire l'image
        run: docker build -t meta-builder:ci .
      - name: Démarrer l'image (base neuve, migrations, interface servie)
        run: |
          docker run -d --name meta-builder --network host \
            -e DATABASE_URI=postgres://postgres:postgrespassword@127.0.0.1:5432/metabuilder_prod \
            -e PAYLOAD_SECRET=ci-docker-secret-0123456789abcdef0123456789abcdef \
            -e SEED_ADMIN_EMAIL=admin@exemple.fr \
            -e SEED_ADMIN_PASSWORD=Ci-Docker-Admin-2026! \
            -e FRONTEND_ORIGIN=http://localhost:4000 \
            -e COOKIE_SECURE=false \
            meta-builder:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4000/api/health/ready 2>/dev/null; then
              echo "Conteneur prêt."
              break
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:4000/api/health/ready || { echo "::error::Le conteneur n'a pas démarré à temps."; docker logs meta-builder; exit 1; }
          curl -fsS -H 'Accept: text/html' http://localhost:4000/ | grep -q 'id="root"' || { echo "::error::Interface de l'orchestrateur non servie."; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://localhost:4000' -d '{"email":"admin@exemple.fr","password":"Ci-Docker-Admin-2026!"}' http://localhost:4000/api/users/login)"
          [ "$code" = "200" ] || { echo "::error::Connexion de l'administrateur : HTTP $code."; docker logs meta-builder; exit 1; }
          docker logs meta-builder 2>&1 | grep -q 'Migrating:' || { echo "::error::Migrations non appliquées au démarrage."; exit 1; }
      - name: Arrêt propre du conteneur
        run: |
          docker stop -t 30 meta-builder
          docker logs meta-builder 2>&1 | grep -q 'Arrêt propre terminé' || { echo "::error::Arrêt propre non journalisé."; docker logs meta-builder; exit 1; }
      - name: Logs du conteneur (en cas d'échec)
        if: failure()
        run: docker logs meta-builder || true
